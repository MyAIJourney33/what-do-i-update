<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Do I Update?</title>
<meta name="theme-color" content="#1D4ED8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:,">
<style>
:root{--bg:#F6F5F1;--card:#FFFFFF;--ink:#15171C;--muted:#5B606B;--body:#4A4F59;--line:#E3E1DA;--blue:#1D4ED8;--blue-ink:#1E3A8A;--blue-bg:#E8EEFC;
--now:#9B1C1C;--now-bg:#FDECEA;--now-line:#F2C4BF;--week:#7A4100;--week-bg:#FFF1D6;--week-line:#F0D9A8;--ok:#12603A;--ok-bg:#E3F3E8;--ok-line:#BFE0CA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 20px 110px}
h1{font:700 30px/1.12 "Space Grotesk",Inter,system-ui,sans-serif;margin:8px 0 6px}
h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
p{margin:0}
.brand{display:flex;align-items:center;gap:10px;font:700 18px "Space Grotesk",Inter,sans-serif}
.sub{color:var(--body)}
.note{display:flex;gap:10px;background:var(--blue-bg);color:var(--blue-ink);border-radius:14px;padding:14px 16px;font-size:14px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #CFCCC3;background:#fff;color:var(--ink);font:600 15px Inter,system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:none;border-radius:14px;background:var(--blue);color:#fff;font:700 17px Inter,system-ui,sans-serif;cursor:pointer;margin-top:12px}
.btn.secondary{background:#fff;color:var(--ink);border:1.5px solid #CFCCC3;min-height:48px;font-size:15px;font-weight:600}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.count{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.count b{font:700 24px "Space Grotesk",Inter,sans-serif}
.count span{font-size:13px;font-weight:600}
.now{background:var(--now-bg);color:var(--now)}.week{background:var(--week-bg);color:var(--week)}.ok{background:var(--ok-bg);color:var(--ok)}
.sec{display:flex;align-items:center;gap:8px;margin:24px 0 10px;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}
.card.c-now{border-color:var(--now-line)}.card.c-week{border-color:var(--week-line)}.card.c-ok{border-color:var(--ok-line);cursor:default}
.card .tag{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.card .t{display:block;font:700 18px/1.25 "Space Grotesk",Inter,sans-serif;margin-bottom:6px}
.card .d{display:block;font-size:14px;color:var(--body)}
.card .more{display:block;font-size:14px;font-weight:600;color:var(--blue);margin-top:8px}
.card.done{opacity:.6}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.box h3{margin:0 0 8px;font-size:15px}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin:6px 0}
.small{font-size:13px;color:var(--body)}
.empty{background:#fff;border:1px dashed #CFCCC3;border-radius:16px;padding:16px;color:var(--body);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 4px calc(14px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;border:none;min-height:48px;font:600 12px Inter,system-ui,sans-serif;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--blue);font-weight:700}
textarea{width:100%;min-height:84px;border:1.5px solid #CFCCC3;border-radius:12px;padding:10px;font:14px ui-monospace,monospace}
label{font-weight:600;font-size:14px;display:block;margin:12px 0 6px}
.back{background:none;border:none;color:var(--blue);font:600 15px Inter,system-ui,sans-serif;min-height:44px;padding:0;cursor:pointer}
svg{flex-shrink:0}
nav.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs[hidden]{display:none}
.card.c-gray{border-color:#D6D3CB;background:#FBFAF7}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.b-confirmed{background:var(--now-bg);color:var(--now)}.b-reported{background:var(--week-bg);color:var(--week)}.b-heads{background:#EEF0F4;color:var(--muted)}
input[type=search],input[type=text],select{width:100%;min-height:48px;border:1.5px solid #CFCCC3;border-radius:12px;padding:0 14px;font:16px Inter,system-ui,sans-serif;background:#fff;color:var(--ink)}
details.cat{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
details.cat summary{min-height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer;list-style:none}
details.cat summary::-webkit-details-marker{display:none}
details.cat .chips{padding:0 12px 14px}
.dev{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.dev .n{font-weight:700;font-size:15px}.dev .s{font-size:13px;color:var(--body)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
:root{--muted-dot:#CFCCC3}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:none}
.check input{width:24px;height:24px;margin:2px 0 0;flex-shrink:0;accent-color:var(--blue)}
.check label{margin:0;font-weight:500;font-size:15px}
.check .why{display:block;font-size:13px;color:var(--body);font-weight:400;margin-top:2px}
.big{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border:none;border-radius:16px;background:var(--now);color:#fff;font:700 18px "Space Grotesk",Inter,sans-serif;padding:0 18px;cursor:pointer;text-align:left}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.linkbtn{background:none;border:none;color:var(--blue);font:600 14px Inter,system-ui,sans-serif;min-height:44px;padding:0;cursor:pointer;text-align:left}
details.how{margin-top:4px}
details.how summary{display:inline-flex;align-items:center;min-height:40px;color:var(--blue);font-weight:600;font-size:14px;cursor:pointer;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"›";margin-left:6px;transition:transform .15s}
details.how[open] summary::after{transform:rotate(90deg)}
details.how ol{margin:2px 0 6px;padding-left:20px;font-size:14px;color:var(--body);background:#F8F7F3;border-radius:10px;padding:10px 12px 10px 30px}
details.how ol li{margin:4px 0}
.check .body{flex:1}
ol.intro{margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
ol.intro li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
ol.intro li::before{content:counter(s);flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font:700 15px/28px Inter,sans-serif;text-align:center}
ol.intro b{display:block;font-size:16px}
ol.intro span{font-size:14px;color:var(--body)}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="sub">Loading…</p></main>
<nav class="tabs" aria-label="Main" id="tabs" hidden>
<button type="button" data-view="alerts">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Alerts</button>
<button type="button" data-view="headlines">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>News</button>
<button type="button" data-view="setup">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>My stuff</button>
<button type="button" data-view="protect">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/></svg>Protect</button>
<button type="button" data-view="settings">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<script>
"use strict";
// Privacy design: everything about the person (their devices, models, checklists, family
// lists) lives only in this browser. All data files are public and identical for everyone;
// matching happens here, on the phone. Nothing is ever sent anywhere.
const DO_NOW_DAYS = 14, THIS_WEEK_DAYS = 45, NEWS_DAYS = 45, REPLACE_DAYS = 730;
const KEY_PROFILES = "wdiu.profiles.v1", KEY_OLD_DEVICES = "wdiu.devices.v1", KEY_FIXED = "wdiu.fixed.v1",
      KEY_CHECKS = "wdiu.checks.v1", KEY_BREACHES = "wdiu.breaches.v1", KEY_INTRO = "wdiu.intro.v1", KEY_PUSH = "wdiu.push.v1";
// Instant alerts server (Cloudflare Worker). Empty = alerts switch hidden.
const PUSH_WORKER = "https://wdiu-push.myaijourney33.workers.dev";
const memory = {};
const store = {
  get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return k in memory ? memory[k] : fallback; } },
  set(k, v) { memory[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep in memory */ } }
};

// Family mode: several named lists on one phone ("Me", "Mom"...). Migrates the old single list.
function loadProfiles() {
  let p = store.get(KEY_PROFILES, null);
  if (!p) p = { active: "Me", lists: { Me: { devices: store.get(KEY_OLD_DEVICES, []), custom: [], models: {} } } };
  for (const l of Object.values(p.lists)) { l.devices = l.devices || []; l.custom = l.custom || []; l.models = l.models || {}; }
  if (!p.lists[p.active]) p.active = Object.keys(p.lists)[0];
  return p;
}
let P = loadProfiles();
const list = () => P.lists[P.active];
let D = { products: [], order: [], kev: { entries: [] }, news: { items: [], plain: {} }, support: { products: {} }, breaches: { breaches: [] } };
let S = { view: "alerts", fixed: new Set(store.get(KEY_FIXED, [])), checks: store.get(KEY_CHECKS, {}), used: new Set(store.get(KEY_BREACHES, [])),
          detail: null, device: null, playbook: null, query: "" };
const selected = () => new Set(list().devices);
function saveProfiles() { store.set(KEY_PROFILES, P); store.set(KEY_OLD_DEVICES, list().devices); }

const ICON = {
  now: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>',
  week: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  ok: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>',
  gray: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><path d="M12 17v.01"/></svg>',
  shield: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  alarm: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M12 8v4"/><path d="M12 15.5v.01"/></svg>',
  lock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
};

// Tiny DOM helper: text always goes in as textContent, never as HTML.
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v; // only used with the constant ICON strings above
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "value") n.value = v;
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}
const icon = name => el("span", { html: ICON[name], style: "display:inline-flex" });
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const ageDays = iso => Math.floor((today() - new Date(iso.slice(0, 10) + "T00:00:00")) / 86400000);
const fmtDate = iso => iso ? new Date(iso.slice(0, 10) + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
const productById = id => D.products.find(p => p.id === id);
const norm = s => s.toLowerCase().replace(/[^a-z0-9+]+/g, " ").trim();
// A device also covers the software it runs (a Surface runs Windows and Edge).
function covered() {
  const out = selected();
  for (const id of list().devices) { const p = productById(id); if (p && p.runs) p.runs.forEach(r => out.add(r)); }
  return out;
}
const mine = ids => { const c = covered(); return ids.filter(id => c.has(id)); };

function computeAlerts() {
  const now = [], week = [], replace = [], notYou = [], oldModels = {};
  for (const e of D.kev.entries) {
    const hit = mine(e.products);
    if (!hit.length) continue;
    const age = ageDays(e.added);
    const plain = D.news.plain[e.cve];
    const names = hit.map(id => productById(id).name);
    // Per-product wording ("Update Edge") only when none of this person's matches use the default wording.
    const own = plain && plain.for && hit.every(h => plain.for[h]) ? plain.for[hit[0]] : null;
    const words = own || plain;
    const a = { id: e.cve, kind: "kev", entry: e, hit, names, plain, confidence: "confirmed",
      title: words ? words.title : "Update " + names.join(", "),
      why: words ? words.why : "Hackers are using a flaw in " + names.join(" and ") + ". Install the latest update." };
    if (e.replace) { if (age <= REPLACE_DAYS) for (const id of hit) (oldModels[id] = oldModels[id] || []).push(e); }
    else if (age <= DO_NOW_DAYS) now.push(a);
    else if (age <= THIS_WEEK_DAYS) week.push(a);
  }
  // One card per product for end-of-life models, not one per CISA entry.
  for (const [id, entries] of Object.entries(oldModels)) {
    const name = productById(id).name;
    replace.push({ id: "eol-" + id + "-" + entries[0].cve, kind: "eol", entries, hit: [id], names: [name], confidence: "confirmed",
      title: "Check your " + name + " model",
      why: `Hackers are attacking ${entries.length} older ${name} model${entries.length > 1 ? "s" : ""} that will never get a fix. If yours is on the list, replace it.` });
  }
  for (const n of D.news.items) {
    if (ageDays(n.date) > NEWS_DAYS) continue;
    const hit = mine(n.affects);
    const a = { id: n.id, kind: "news", news: n, hit, names: hit.map(id => productById(id).name), title: n.title,
      confidence: n.verdict === "do_now" ? "reported" : "heads", why: hit.length ? n.if_affected : n.if_not };
    if (!hit.length) notYou.push(a);
    else if (n.verdict === "do_now") now.push(a);
    else week.push(a);
  }
  return { now, week, replace, notYou };
}

const modelName = (sp, label) => /^[0-9]/.test(label) || label.length < 4 ? `${sp.source} ${label}` : label;
// Is this model still getting security updates? (from endoflife.date, chosen by the person)
function supportFor(id) {
  const sp = D.support.products[id]; let model = list().models[id];
  if (!sp || !model) return null;
  const row = sp.rows.find(r => r.label === model);
  if (!row) return null;
  model = modelName(sp, model);
  if (row.ended) return { ended: true, row, text: `${model} no longer gets security updates${row.until ? " (since " + fmtDate(row.until) + ")" : ""}.` };
  const left = row.until ? Math.floor((new Date(row.until) - today()) / 86400000) : null;
  return { ended: false, soon: left !== null && left < 180, row,
    text: row.until ? `${model} gets security updates until about ${fmtDate(row.until)}.` : `${model} still gets security updates.` };
}

// One status line per device, so a quiet device is answered out loud.
function deviceStatus(id, A) {
  const inList = (arr) => arr.some(a => a.hit.includes(id) || (productById(id) && (productById(id).runs || []).some(r => a.hit.includes(r))));
  const sup = supportFor(id);
  if (inList([...A.now, ...A.replace])) return { tone: "now", text: "Act now: see the alert above" };
  if (sup && sup.ended) return { tone: "now", text: "No longer gets security updates" };
  if (inList(A.week)) return { tone: "week", text: "Update this week" };
  if (sup && sup.soon) return { tone: "week", text: "Updates end soon" };
  const p = productById(id);
  return { tone: "ok", text: p && p.news_only && !(p.runs || []).length ? "Watched through maker notices and news · nothing reported" : `No attacks reported in ${NEWS_DAYS} days` };
}

const CONF = { confirmed: ["b-confirmed", "Confirmed attacks"], reported: ["b-reported", "Reported"], heads: ["b-heads", "Heads up"] };
function header() {
  const names = Object.keys(P.lists);
  return el("div", { class: "brand", style: "justify-content:space-between" },
    el("span", { class: "row", style: "gap:10px" }, icon("shield"), "What Do I Update?"),
    names.length > 1 ? el("select", { "aria-label": "Whose devices", style: "width:auto;min-height:40px;font-size:14px",
      onchange: e => { P.active = e.target.value; saveProfiles(); render(); } },
      ...names.map(n => el("option", { value: n, selected: n === P.active }, n))) : null);
}

function card(a, tone) {
  const done = S.fixed.has(a.id);
  const tag = a.names && a.names.length ? a.names.join(" · ") : (a.kind === "news" ? "In the news" : "");
  const conf = a.confidence && tone !== "ok" ? CONF[a.confidence] : null;
  const kids = [el("span", { class: "tag", style: `color:var(--${tone})` }, tag, conf ? el("span", { class: "badge " + conf[0] }, conf[1]) : null),
    el("span", { class: "t" }, (done ? "Done: " : "") + a.title),
    el("span", { class: "d" }, a.why)];
  if (tone === "ok") return el("div", { class: "card c-ok" }, ...kids);
  kids.push(el("span", { class: "more" }, "How to fix ›"));
  return el("button", { type: "button", class: `card c-${tone}${done ? " done" : ""}`, onclick: () => go("detail", a) }, ...kids);
}

function section(tone, label, items) {

const STALE_ALERT_HOURS = 48, STALE_NEWS_DAYS = 14;
function freshness() {
  const built = Date.parse(D.kev.builtAt || ""), news = Date.parse((D.news.updated || "") + "T12:00:00");
  return { alertsHours: isNaN(built) ? Infinity : (Date.now() - built) / 3600000,

// A test ping goes only to this phone, so people can see alerts work before a real one arrives.
async function sendTestAlert() {

  if (!sub) { store.set(KEY_PUSH, false); render(); return "Alerts got switched off on this phone. Tap Turn on instant alerts again."; }
  const r = await fetch(PUSH_WORKER + "/test", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ endpoint: sub.endpoint }) });
  if (r.status === 429) return "A test was just sent. Wait 2 minutes before sending another.";
  if (r.status === 404) return "This phone isn't signed up anymore. Turn instant alerts off, then on again.";
  const res = r.ok ? await r.json() : {};

    : `The test didn't go through${res.status ? ` (code ${res.status})` : ""}. Turn instant alerts off, then on again, and try once more.`;
}

}

function toggleFixed(id) { S.fixed.has(id) ? S.fixed.delete(id) : S.fixed.add(id); store.set(KEY_FIXED, [...S.fixed]); }
function go(view, arg) { S.view = view; if (view === "detail") S.detail = arg; if (view === "device") S.device = arg; if (view === "hacked" && !arg) S.playbook = null; render(); window.scrollTo(0, 0); }

function render() {
  const app = document.getElementById("app");
  const empty = !list().devices.length && !list().custom.length;
  const views = { alerts: viewAlerts, detail: viewDetail, device: viewDevice, headlines: viewHeadlines, setup: () => viewSetup(empty), welcome: viewWelcome, notify: viewNotify,
                  protect: viewProtect, hacked: viewHacked, settings: viewSettings };
  app.replaceChildren(...[].concat((views[S.view] || viewAlerts)()).filter(x => x != null && x !== false));
  const tabs = document.getElementById("tabs");
  tabs.hidden = empty && Object.keys(P.lists).length === 1;
  const tab = { detail: "alerts", device: "alerts", hacked: "protect", welcome: "settings", notify: "settings" }[S.view] || S.view;
  tabs.querySelectorAll("button").forEach(b => { b.removeAttribute("aria-current"); if (b.dataset.view === tab) b.setAttribute("aria-current", "page"); });
}

document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.view); });

const getJSON = (f, optional) => fetch(f, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(f); return r.json(); })
  .catch(e => { if (optional) return null; throw e; });
Promise.all([getJSON("products.json"), getJSON("kev-slim.json"), getJSON("news.json"), getJSON("support.json", true), getJSON("breaches.json", true)])
  .then(([products, kev, news, support, breaches]) => {
    D = { products: products.products, order: products.category_order || [], kev, news,
          support: support || { products: {} }, breaches: breaches || { breaches: [] } };
    const known = new Set(D.products.map(p => p.id));
    for (const l of Object.values(P.lists)) l.devices = l.devices.filter(i => known.has(i));
    if (!list().devices.length && !list().custom.length) S.view = store.get(KEY_INTRO, false) ? "setup" : "welcome";
    render();
  })
  .catch(() => { document.getElementById("app").replaceChildren(el("p", { class: "empty" }, "Couldn't load the alert list. Check your connection and reload.")); });

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
